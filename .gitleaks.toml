# .gitleaks.toml — gitleaks configuration for the CANS platform.
#
# Extends the built-in default ruleset (do NOT disable it) and adds a path
# allowlist for framework-generated Markdown documentation and diagrams.
#
# WHY THIS EXISTS
# ---------------
# `.claude/` commands and `/create-specifications`, `/create-epics`, etc.
# generate Mermaid diagrams and specs that depict authentication flows
# (PingID / JWKS / OAuth). Those diagrams contain illustrative token/secret
# EXAMPLE values inside node labels and sequence messages — e.g.
# `apiKey: "a1b2c3..."`, `token=eyJ...`, `secret=...`. gitleaks' entropy-based
# `generic-api-key` rule flags these keyword+entropy pairings as leaks, even
# though they are documentation placeholders, not real credentials.
#
# NOTE: Hex color codes in `classDef fill:#... stroke:#...` do NOT trip
# gitleaks — the false positives come from the auth-flow example strings.
#
# SCOPE / TRADE-OFF
# -----------------
# This allowlists Markdown (*.md) ONLY under generated-docs directories.
# Real secrets belong in `.env.local` / AWS Secrets Manager and live in code
# or config files (*.ts, *.json, *.yml, .env*, etc.), which remain FULLY
# scanned. We intentionally do not lower any rule's entropy threshold, so
# detection strength across the actual codebase is unchanged.
#
# Per-finding exceptions (e.g. the pinned Figma file key) still live in
# `.gitleaksignore` by fingerprint; use that for one-off non-.md matches.

title = "CANS gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Framework-generated docs & Mermaid diagrams (Markdown only)"
paths = [
  # Specs, epics, tasks, RTM generated by /create-specifications & friends
  '''specs/.*\.md$''',
  # Planning docs (architecture / integration plans with diagrams)
  '''my-plans/.*\.md$''',
  # Framework standards, patterns, templates, agents, commands (docs w/ diagrams)
  '''\.claude/.*\.md$''',
  # Project technical docs & runbooks with architecture diagrams
  '''docs/.*\.md$''',
]
