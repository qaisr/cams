# Security scanning — dependency audit, Snyk, secret detection
# Runs on PR, push to main, and weekly schedule
name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1' # Weekly Monday 2am UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ── Snyk Security Scan ──────────────────────────────────────────────────────
  snyk-security-scan:
    name: Snyk Security Scan
    # Use PPCC reusable workflow (matches your existing pattern)
    uses: PPCC-General/gha-base-templates/.github/workflows/reusable-snyk-scan.yaml@wfs/latest
    with:
      build-break: true # Fail CI on high/critical
      build-break-threshold: high
      debug-mode: false
    secrets: inherit

  # ── Dependency Audit (pnpm — fast, no token needed) ─────────────────────────
  dependency-audit:
    name: Dependency Audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high
        # Produces non-zero exit on high/critical — fails the job

  # ── Secret Detection (Gitleaks) ─────────────────────────────────────────────
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for secret scanning

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CodeQL ───────────────────────────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
