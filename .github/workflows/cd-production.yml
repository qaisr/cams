# Deploy to production — manual approval gate required
name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
      version:
        description: 'Git SHA or tag to deploy (defaults to latest main)'
        required: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  AWS_REGION: ap-southeast-2

jobs:
  validate-input:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ Confirmation required. Type DEPLOY to proceed."
            exit 1
          fi
          echo "✅ Deployment confirmed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate-input
    environment:
      name: production # GitHub environment — requires reviewer approval
      url: https://app.example.com

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run generation pipeline
        run: pnpm generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Build all workspaces
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL_PRODUCTION }}
          NEXT_PUBLIC_APP_ENV: production

      - name: Create deployment record
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
            });
            return deployment.data.id;

      - name: Run database migrations
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}

      - name: Deploy API (ECS Fargate)
        run: |
          cd infra
          pnpm cdk deploy app-production-api \
            --require-approval never \
            --outputs-file cdk-outputs.json
        env:
          CDK_DEPLOY_ENV: production

      - name: Roll out ECS service
        run: |
          aws ecs update-service \
            --cluster app-production \
            --service app-production-api \
            --force-new-deployment
        env:
          AWS_REGION: ap-southeast-2

      - name: Deploy Web (CloudFront + S3)
        run: |
          cd infra
          pnpm cdk deploy WebStack-production \
            --require-approval never
        env:
          CDK_DEPLOY_ENV: production

      - name: Smoke test production
        run: |
          API_URL="${{ vars.API_BASE_URL_PRODUCTION }}"
          echo "Testing API health..."
          curl -sf "${API_URL}/health" | jq .
          echo "✅ Production smoke test passed"

      - name: Update deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              environment_url: 'https://app.example.com',
            });

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ vars.SLACK_DEPLOY_CHANNEL }}
          slack-message: |
            *Production Deploy:* ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
            *Version:* ${{ github.event.inputs.version || github.sha }}
            *Deployed by:* ${{ github.actor }}
            *URL:* https://app.example.com
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
