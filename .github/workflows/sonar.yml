name: SonarQube

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  sonar-quality-scan:
    name: SonarQube Quality Scan
    runs-on: default # Your org's self-hosted runner (DirectConnect to sonar)
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history — required for blame and new code detection

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run generation pipeline
        run: pnpm generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Run tests with coverage (API)
        run: pnpm --filter @repo/api test:coverage
        env:
          NODE_ENV: test
        continue-on-error: false # Coverage must pass before Sonar runs

      - name: Run tests with coverage (Web)
        run: pnpm --filter @repo/web test:coverage
        env:
          NODE_ENV: test
        continue-on-error: false

      - name: Verify coverage reports exist
        run: |
          for f in \
            apps/api/coverage/lcov.info \
            apps/web/coverage/lcov.info; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing coverage report: $f"
              echo "   Ensure jest config outputs lcov format"
              exit 1
            fi
          done
          echo "✅ Coverage reports present"

      - name: Run SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v2.0.1
        env:
          SONAR_TOKEN: ${{ secrets.TKN_SNR }}
          SONAR_ROOT_CERT: ${{ vars.SONAR_ROOT_CERT }}
          SONAR_HOST_URL: https://sonarqube.internal.ppcc
        with:
          args: >
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.scm.revision=${{ github.sha }}
            ${{ github.event_name == 'pull_request' && format(
              '-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
              github.event.pull_request.number,
              github.head_ref,
              github.base_ref
            ) || format('-Dsonar.branch.name={0}', github.ref_name) }}

      - name: Upload coverage to Codecov (parallel)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
          fail_ci_if_error: false
