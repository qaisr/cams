# Playwright E2E tests — full stack (API + Web) against local Docker environment
# Runs on PR to main and on push to main (not on every PR to develop — slow)
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run generation pipeline
        run: pnpm generate
        env:
          DATABASE_URL: postgresql://myapp:myapp@localhost:5432/myapp

      - name: Start infrastructure (Postgres + LocalStack)
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres localstack
          # Wait for Postgres to be ready
          timeout 30 bash -c 'until docker compose -f docker/docker-compose.yml exec -T postgres pg_isready; do sleep 1; done'

      - name: Run database migrations + seed
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed
        env:
          DATABASE_URL: postgresql://myapp:myapp@localhost:5432/myapp

      - name: Build API and Web
        run: pnpm turbo run build
        env:
          DATABASE_URL: postgresql://myapp:myapp@localhost:5432/myapp
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          NEXT_PUBLIC_APP_ENV: e2e

      - name: Start API server
        run: pnpm --filter @repo/api start &
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://myapp:myapp@localhost:5432/myapp
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_REGION: ap-southeast-2
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          EVENT_BUS_NAME: local-bus
          AUTH_JWKS_URI: http://localhost:4566/.well-known/jwks.json
          AUTH_AUDIENCE: e2e-audience
          PORT: 3001

      - name: Start Web server
        run: pnpm --filter @repo/web start &
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          PORT: 3000

      - name: Wait for servers to be ready
        run: |
          timeout 30 bash -c 'until curl -sf http://localhost:3001/health; do sleep 1; done'
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 1; done'

      - name: Run Playwright tests
        run: pnpm --filter @repo/web test:e2e
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() # Always upload — useful for debugging failures
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker/docker-compose.yml down
