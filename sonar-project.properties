# =============================================================================
# SonarQube Configuration — NestJS + NextJS Monorepo
# https://sonarqube.internal.ppcc
# =============================================================================

# ── Project Identity ──────────────────────────────────────────────────────────
sonar.projectKey=my-app
sonar.projectName=My App
sonar.projectVersion=1.0.0

# ── Source roots (monorepo — all workspaces) ──────────────────────────────────
sonar.sources=apps/api/src,apps/web/src,apps/web/app,packages/validation/src,packages/common/src
sonar.tests=apps/api/src,apps/web/src
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.tsx,\
  **/__tests__/**/*

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/generated/**,\
  **/prisma/migrations/**,\
  **/coverage/**,\
  **/.turbo/**,\
  **/cdk.out/**,\
  **/*.d.ts,\
  **/jest.config.*,\
  **/next.config.*,\
  **/orval.config.*,\
  **/*.config.mjs,\
  **/scripts/**

sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/generated/**,\
  **/prisma/migrations/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  **/__fixtures__/**,\
  **/mocks/**,\
  **/jest.setup.*,\
  **/jest.config.*,\
  **/next.config.*,\
  **/scripts/**,\
  **/infra/**

sonar.cpd.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__fixtures__/**

# ── Language ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── TypeScript ────────────────────────────────────────────────────────────────
sonar.typescript.tsconfigPaths=\
  apps/api/tsconfig.json,\
  apps/web/tsconfig.json,\
  packages/validation/tsconfig.json,\
  packages/common/tsconfig.json

# ── Coverage (LCOV from Jest) ─────────────────────────────────────────────────
# Generated by: pnpm test:coverage
# Each workspace outputs its own lcov.info
sonar.javascript.lcov.reportPaths=\
  apps/api/coverage/lcov.info,\
  apps/web/coverage/lcov.info,\
  packages/validation/coverage/lcov.info,\
  packages/common/coverage/lcov.info

# ── Test results (Jest JUnit XML) ────────────────────────────────────────────
# Generated by jest-junit reporter
sonar.testExecutionReportPaths=\
  apps/api/test-results/junit.xml,\
  apps/web/test-results/junit.xml

# ── Quality Gate ──────────────────────────────────────────────────────────────
# Fail PR if quality gate fails (set in SonarQube server UI)
# sonar.qualitygate.wait=true     ← enable if sonar server supports it
sonar.qualitygate.timeout=300

# ── PR / Branch analysis ──────────────────────────────────────────────────────
# These are injected by the GitHub Action — do not hardcode here
# sonar.pullrequest.key=
# sonar.pullrequest.branch=
# sonar.pullrequest.base=
# sonar.branch.name=

# ── Scanner tuning ────────────────────────────────────────────────────────────
sonar.scm.provider=git
sonar.scm.forceReloadAll=false
sonar.log.level=INFO
